plugins { id 'com.android.application' }
android {
    namespace 'com.nfsmw.androidevolved'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        // Its own id: installs next to the original Android Evolved app instead of replacing it.
        applicationId 'com.prollynotzjay.nfsmwrefined'
        minSdk 29
        targetSdk 35
        versionCode 100
        versionName '1.0.0'
        // -PnfsAbi=armeabi-v7a builds the separate 32-bit APK.
        ndk { abiFilters(project.findProperty('nfsAbi') ?: 'arm64-v8a') }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.30.5' } }
    // adrenotools opens its namespace hook libraries by path from nativeLibraryDir.
    packaging { jniLibs { useLegacyPackaging true } }
}

// APK file name: NFSMW-Refined-debug.apk / NFSMW-Refined-release.apk
base { archivesName = 'NFSMW-Refined' }
